services:
  # 1. FastAPI Web Service
  - type: web
    name: careeros-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: careeros-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # JSON array containing the deployed frontend origin

  # 2. Celery Async Task Worker
  - type: worker
    name: careeros-celery-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.tasks.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: careeros-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

      - key: SECRET_KEY
        fromService:
          type: web
          name: careeros-backend
          envVarKey: SECRET_KEY

  # 3. Redis Instance
  - type: redis
    name: careeros-redis
    ipAllowList: [] # Only allow internal connection

databases:
  # 4. PostgreSQL Database supporting pgvector
  - name: careeros-postgres
    databaseName: careeros
    user: admin
    ipAllowList: [] # Only allow internal service access
